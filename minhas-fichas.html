<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Fichas — Heartsoul</title>
<link rel="icon" href="assets/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120F0C">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .folder-group{ margin-bottom:28px; }
  .folder-group-head{
    display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:8px;
    border-bottom:1px solid var(--hairline);
  }
  .folder-group-head h3{ font-family:'Cinzel',serif; color:var(--gold); font-size:17px; margin:0; }
  .folder-group-head .count{ font-size:12.5px; color:var(--ink-mute); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="seal-icon" viewBox="0 0 120 120" fill="none">
      <circle cx="60" cy="60" r="54" stroke="#C9A15C" stroke-width="2" opacity="0.5"/>
      <circle cx="60" cy="60" r="4" fill="#C9A15C"/>
      <path d="M60 24 L84 60 L60 96 L36 60 Z" stroke="#9C2B2B" stroke-width="2" opacity="0.55" fill="none"/>
    </svg>
    <div>
      <div class="brand-title">HEARTSOUL</div>
      <div class="brand-sub">Minhas Fichas</div>
    </div>
  </div>
  <div class="topbar-right" id="topbarRight"></div>
</div>

<div class="shell wide">
  <div class="page-head">
    <div class="eyebrow">Seus personagens</div>
    <h1>Minhas Fichas</h1>
    <p>Todas as fichas que você criou para essa mesa. Você pode ter mais de um personagem.</p>
  </div>

  <div style="margin-bottom:24px; display:flex; gap:10px; flex-wrap:wrap;">
    <a href="ficha-editor.html" class="btn" style="display:inline-block; width:auto; padding:12px 24px;">+ Criar nova ficha</a>
    <button type="button" id="importBtn" class="btn secondary" style="display:inline-block; width:auto; padding:12px 24px;">⬆️ Importar ficha (.json)</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
  </div>
  <div id="importMsg"></div>

  <div id="sheetsList" class="center-loading">Carregando fichas…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script>
// Qualquer usuário logado pode acessar — inclusive contas de Mestre, que
// também podem criar e jogar seus próprios personagens ("modo jogador").
// A consulta abaixo já filtra só pelas fichas do próprio usuário (ownerId),
// então mesmo o Mestre só vê aqui as fichas que ELE criou — nunca as dos
// outros jogadores (isso continua exclusivo do Painel do Mestre).
guardPage(null, async (user, profile) => {
  renderTopbar(profile);
  const listEl = document.getElementById('sheetsList');
  const importMsg = document.getElementById('importMsg');
  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  // ---- Importar ficha (lê um .json exportado daqui e cria uma ficha nova) ----
  // Ligado antes do "return" de lista vazia, pra funcionar mesmo sem nenhuma ficha ainda.
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = ''; // permite re-selecionar o mesmo arquivo depois
    if (!file) return;
    importMsg.innerHTML = '';
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || typeof data !== 'object' || !('characterName' in data) || !('attributes' in data)) {
        throw new Error('Esse arquivo não parece ser uma ficha exportada do Heartsoul.');
      }
      delete data.id;
      delete data.ownerId;
      delete data.createdAt;
      delete data.updatedAt;
      // Ficha importada de outra campanha/mesa entra sem pasta vinculada —
      // o jogador escolhe a pasta certa depois, editando a ficha.
      data.folderId = null;
      data.folderName = null;
      data.ownerId = user.uid;
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      const ref = await db.collection('sheets').add(data);
      location.href = 'ficha-view.html?id=' + ref.id;
    } catch (err) {
      importMsg.innerHTML = `<div class="error-msg">Erro ao importar ficha: ${escapeHtml(err.message)}</div>`;
    }
  });

  try {
    const [snap, folders] = await Promise.all([
      db.collection('sheets').where('ownerId', '==', user.uid).get(),
      getFolders()
    ]);
    if (snap.empty) {
      listEl.classList.remove('center-loading');
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">⚔</div>
          <p>Você ainda não tem nenhuma ficha.</p>
          <p>Clique em "Criar nova ficha" para começar sua jornada.</p>
        </div>`;
      return;
    }

    const sheets = [];
    snap.forEach(doc => sheets.push({ id: doc.id, ...doc.data() }));
    sheets.sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));

    function cardHtml(s) {
      return `
        <div class="sheet-card">
          <div class="sc-head">
            <div style="display:flex; align-items:center; gap:12px;">
              ${s.appearanceImage
                ? `<img src="${escapeHtml(s.appearanceImage)}" alt="Aparência de ${escapeHtml(s.characterName || 'personagem')}" class="avatar-circle" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar-circle-placeholder',textContent:'👤'}));">`
                : `<div class="avatar-circle-placeholder">👤</div>`}
              <div>
                <h3>${escapeHtml(s.characterName || 'Sem nome')}</h3>
                <div class="sc-meta">${escapeHtml(s.raceName || '—')} · Nível ${s.level || 1} · ${escapeHtml(s.energyType || '')}</div>
              </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a href="ficha-view.html?id=${s.id}" class="btn secondary small" style="width:auto;">Ver</a>
              <a href="ficha-editor.html?id=${s.id}" class="btn small" style="width:auto;">Editar</a>
              <button type="button" class="btn secondary small" data-export="${s.id}" style="width:auto;">⬇️ Exportar</button>
            </div>
          </div>
          <div class="sc-owner">Atualizada em ${fmtDate(s.updatedAt)}</div>
        </div>`;
    }

    // Só mostra os grupos de pasta se existir mais de uma pasta em uso
    // (ou fichas soltas junto de fichas com pasta) — senão é ruído desnecessário.
    const usedFolderIds = new Set(sheets.map(s => s.folderId).filter(Boolean));
    listEl.classList.remove('center-loading');
    if (usedFolderIds.size === 0) {
      listEl.innerHTML = `<div class="cards-grid">${sheets.map(cardHtml).join('')}</div>`;
    } else {
      const groups = folders
        .filter(f => usedFolderIds.has(f.id))
        .map(f => ({ id: f.id, name: f.name, sheets: sheets.filter(s => s.folderId === f.id) }));
      const loose = sheets.filter(s => !s.folderId);
      if (loose.length) groups.push({ id: '', name: 'Sem pasta / campanha', sheets: loose });

      listEl.innerHTML = groups.map(g => `
        <div class="folder-group">
          <div class="folder-group-head">
            <h3>${escapeHtml(g.name)}</h3>
            <span class="count">${g.sheets.length} ficha${g.sheets.length === 1 ? '' : 's'}</span>
          </div>
          <div class="cards-grid">${g.sheets.map(cardHtml).join('')}</div>
        </div>`).join('');
    }

    // ---- Exportar ficha (baixa um .json com todos os dados salvos) ----
    function sheetExportPayload(s) {
      const clean = { ...s };
      delete clean.id;
      delete clean.ownerId;
      // Timestamps do Firestore não são serializáveis em JSON puro — convertemos
      // para texto ISO só como referência (não são usados de volta na importação).
      if (clean.createdAt && clean.createdAt.seconds) clean.createdAt = new Date(clean.createdAt.seconds * 1000).toISOString();
      if (clean.updatedAt && clean.updatedAt.seconds) clean.updatedAt = new Date(clean.updatedAt.seconds * 1000).toISOString();
      return clean;
    }
    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-export]');
      if (!btn) return;
      const s = sheets.find(x => x.id === btn.dataset.export);
      if (!s) return;
      const safeName = (s.characterName || 'ficha')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase();
      downloadJson(`heartsoul-ficha-${safeName || 'sem-nome'}.json`, sheetExportPayload(s));
    });
  } catch (err) {
    listEl.classList.remove('center-loading');
    listEl.innerHTML = `<div class="error-msg">Erro ao carregar fichas: ${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
